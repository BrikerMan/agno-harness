[project]
name = "agno-harness"
version = "0.2.0"
description = "Enterprise agent scaffolding: you write the business and the cards; resume, compression, and channels are production-ready"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eliyar Eziz" }]
keywords = ["agno", "agent", "harness", "ag-ui", "teams", "lark", "feishu", "gateway", "multi-channel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "agno>=2.8.7",
    "ag-ui-protocol>=0.1.19",
    "httpx>=0.27",
    "jsonpatch>=1.33",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "rich>=13.9",
    "typer>=0.16",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
    "qrcode>=8.2",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]
teams = [
    "pycryptodome>=3.20",
]
lark = [
    "lark-oapi>=1.2.0",
    "websockets>=12.0",
]
sqlite = [
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0.30",
]
postgres = [
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
]
redis = [
    "redis>=5.0",
]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-agno>=0.1.29",
]
all = [
    "agno-harness[fastapi,teams,lark,sqlite,postgres,redis,otel]",
]

[project.urls]
Homepage = "https://github.com/eliyar-eziz"
Documentation = "https://github.com/eliyar-eziz"

[project.scripts]
agno-harness = "agno_harness.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agno_harness", "src/better_agno_toolbox"]

[tool.hatch.build.targets.wheel.force-include]
"resources/templates/project" = "agno_harness/project_template"
"resources/templates/variants" = "agno_harness/project_template_variants"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0.30",
    "fastapi[standard]>=0.115",
    "websockets>=12.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "openinference-instrumentation-agno>=0.1.29",
    "openai>=1.50",
    "redis>=5.0",
    "pycryptodome>=3.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that call real APIs",
    "teams: tests requiring Teams SDK",
    "lark: tests requiring Lark SDK",
    "postgres: tests requiring PostgreSQL",
    "redis: tests requiring Redis",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "resources/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
